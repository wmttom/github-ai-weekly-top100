name: One-off AI Top100 2026-11-06
on:
  push:
    branches: [run-weekly-20261106]
permissions:
  contents: write
concurrency:
  group: onetime-ai-top100-20261106
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TZ: Asia/Shanghai
      RUN_DATE: "2026-11-06"
      OUTPUT_FILE: "2026年11月06日.csv"
      RESULT_BRANCH: publish-weekly-20261106
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-weekly.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-weekly.txt
      - name: Fetch and validate three live Trendshift pages (3 attempts, 60s spacing)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json,os,sys,time
          from pathlib import Path
          import requests
          spec=importlib.util.spec_from_file_location("weekly","scripts/generate_weekly_ranking.py")
          mod=importlib.util.module_from_spec(spec);sys.modules[spec.name]=mod;spec.loader.exec_module(mod)
          run=Path(os.environ["RUNNER_TEMP"])/"trendshift-2026-11-06";run.mkdir(exist_ok=True)
          urls={"monthly":"https://trendshift.io/monthly","weekly":"https://trendshift.io/weekly","daily":"https://trendshift.io/"}
          summary={}
          for period,url in urls.items():
              at=[];success=False
              for attempt in range(1,4):
                  try:
                      response=requests.get(url,headers={"User-Agent":"Mozilla/5.0 Chrome/136","Cache-Control":"no-cache,no-store","Pragma":"no-cache"},timeout=(30,120))
                      response.raise_for_status()
                      if response.url.rstrip("/")!=url.rstrip("/"):raise RuntimeError("Redirected away from canonical page")
                      if len(response.content)<40000:raise RuntimeError("Short HTML")
                      age=int(response.headers.get("Age","0") or "0")
                      if age>900:raise RuntimeError("Stale CDN cache: Age "+str(age))
                      p=run/(period+".html");p.write_bytes(response.content)
                      rows=mod.parse(p,period)
                      at.append({"n":attempt,"ok":True,"http":response.status_code,"rows":len(rows),"bytes":len(response.content),"age":age})
                      success=True;break
                  except Exception as e:
                      at.append({"n":attempt,"ok":False,"error":repr(e)})
                      if attempt<3:time.sleep(60)
              summary[period]={"url":url,"success":success,"attempts":at}
              print(json.dumps({period:summary[period]},ensure_ascii=False),flush=True)
              if not success:raise SystemExit("ABORT: Trendshift "+period+" unavailable after 3 attempts; no ranking will be generated")
          with open(os.environ["GITHUB_ENV"],"a") as f:f.write("TREND_DIR="+str(run)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("## Trendshift official live retrieval\n\n")
              for period,x in summary.items():f.write(f"- {period}: OK, attempts={len(x['attempts'])}, repositories={x['attempts'][-1]['rows']}\n")
          PY
      - name: Generate with AI-only filtering and verified recent code commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,os,re,sys
          from datetime import datetime,timedelta,timezone
          from urllib.parse import quote
          import requests
          spec=importlib.util.spec_from_file_location("weekly","scripts/generate_weekly_ranking.py")
          mod=importlib.util.module_from_spec(spec);sys.modules[spec.name]=mod;spec.loader.exec_module(mod)
          old_valid=mod.valid;old_excluded=mod.excluded
          since=(datetime.now(timezone.utc)-timedelta(days=30)).strftime("%Y-%m-%dT%H:%M:%SZ")
          sess=requests.Session();sess.headers.update({"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json","User-Agent":"verified-ai-weekly"})
          cache={};counts={"ai_fail":0,"excluded":0,"commit_fail":0,"eligible":0}
          def info(c):
              return " ".join([c.repo,c.meta.get("description") or ""," ".join(c.meta.get("topics") or [])]+[(r.desc or "")+" "+" ".join(r.topics) for r in c.trend.values()]).lower()
          patterns=[r"\bai\b",r"\bagent(s|ic)?\b",r"\bmcp\b",r"\bllm\b",r"\brag\b",r"\bclaude\b",r"\bcodex\b",r"\bcopilot\b",r"\bgpt\b",r"\bdeepseek\b",r"\bqwen\b",r"\bgemini\b",r"\bneural\b",r"\binference\b",r"\bmachine learning\b",r"\bdeep learning\b",r"\bdiffusion\b",r"\bgenerative\b",r"\bembedding(s)?\b",r"\btranscrib(e|er|ing)\b",r"\btext.to.speech\b",r"\btts\b",r"\bstt\b",r"\bcomputer use\b",r"\bmodel context protocol\b",r"\blanguage model\b",r"\brobot(s|ics)?\b",r"人工智能|智能体|大模型|机器学习|深度学习|多模态|具身智能|文生图|语音识别|代码助手|模型推理"]
          def is_ai(c):
              yes=any(re.search(k,info(c),re.I) for k in patterns)
              if not yes:counts["ai_fail"]+=1
              return yes
          def excluded(c):
              s=info(c);n=c.repo.split("/",1)[-1].lower()
              bad=old_excluded(c) or n.startswith(("awesome-","awesome_","curated-","tutorial-","tutorial_")) or n.endswith(("-book","_book","-roadmap","_roadmap")) or bool(re.search(r"\bawesome list\b|\bcurated list\b|\bresource collection\b|\bcurriculum\b|\btextbook\b|\btutorial series\b|\blearning roadmap\b",s))
              if bad:counts["excluded"]+=1
              return bad
          def valid(c,now):
              if c.meta.get("error_status") or not c.meta.get("full_name") or not old_valid(c,now):return False
              repo=c.meta["full_name"];k=repo.lower()
              if k not in cache:
                  try:
                      r=sess.get("https://api.github.com/repos/"+quote(repo,safe="/")+"/commits",params={"since":since,"per_page":1},timeout=(20,70))
                      if r.status_code!=200:print("Commit verification HTTP",repo,r.status_code,flush=True)
                      cache[k]=r.status_code==200 and isinstance(r.json(),list) and len(r.json())>0
                  except Exception as e:
                      cache[k]=False;print("Commit verification error",repo,repr(e),flush=True)
              if not cache[k]:counts["commit_fail"]+=1
              else:counts["eligible"]+=1
              return cache[k]
          def license_now(c):
              spdx=(c.meta.get("license_spdx") or "").strip()
              return spdx if spdx and spdx.upper() not in ("OTHER","NOASSERTION","NONE","NULL") else "未知 / 未声明"
          mod.ai=is_ai;mod.excluded=excluded;mod.valid=valid;mod.license=license_now
          sys.argv=["gen","--repo-root",".","--input-dir",os.environ["TREND_DIR"],"--date",os.environ["RUN_DATE"]]
          try:mod.main()
          finally:print("Filter summary:",counts,flush=True)
          PY
      - name: Validate 100-row CSV, unique projects and strict descending scores
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_FILE"
          python - <<'PY'
          import csv,os,re
          from pathlib import Path
          with Path(os.environ["OUTPUT_FILE"]).open(encoding="utf-8-sig",newline="") as f:
              reader=csv.DictReader(f)
              expected=["排名","项目","热度分","对比上周排名变动","项目分类","项目 License","项目简介"]
              assert reader.fieldnames==expected
              rows=list(reader)
          assert len(rows)==100
          assert [int(r["排名"]) for r in rows]==list(range(1,101))
          scores=[int(r["热度分"]) for r in rows]
          assert all(a>b for a,b in zip(scores,scores[1:]))
          assert len({r["项目"].lower() for r in rows})==100
          assert all(re.fullmatch(r"[^/\s]+/[^/\s]+",r["项目"]) for r in rows)
          assert all(re.fullmatch(r"(新上榜|持平|上升[1-9][0-9]*|下降[1-9][0-9]*)",r["对比上周排名变动"]) for r in rows)
          assert all(r["项目简介"].strip() and len(r["项目简介"])<=300 and r["项目分类"].strip() and r["项目 License"].strip() for r in rows)
          print("CSV structure verified; TOP10:",[(r["项目"],r["对比上周排名变动"]) for r in rows[:10]],flush=True)
          print("Rank100:",rows[-1],flush=True)
          PY
      - name: Commit to candidate branch after complete validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$OUTPUT_FILE"
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add weekly GitHub AI Top100 ranking: 2026年11月06日"
          git push origin HEAD:"$RESULT_BRANCH"
