# trigger: 2026-08-21 official Trendshift weekly and daily pages
name: One-off GitHub AI Top100 2026-08-21

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-weekly-20260821.yml'

permissions:
  contents: write

concurrency:
  group: one-off-github-ai-top100-20260821
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      OUTPUT_FILE: 2026年08月21日.csv

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-weekly.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-weekly.txt

      - name: Use current official Trendshift weekly page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate_weekly_ranking.py')
          text = path.read_text(encoding='utf-8')
          old = 'https://trendshift.io/github-trending-repositories?trending-limit=100&trending-range=7'
          new = 'https://trendshift.io/weekly'
          if old not in text:
              raise SystemExit('Expected Trendshift weekly URL was not found in generator')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Generate weekly ranking
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_weekly_ranking.py --repo-root . --date 2026-08-21

      - name: Validate generated CSV
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_FILE"
          python - <<'PY'
          import csv
          import os
          import re
          from pathlib import Path

          expected = ['排名', '项目', '热度分', '对比上周排名变动', '项目分类', '项目 License', '项目简介']
          path = Path(os.environ['OUTPUT_FILE'])
          with path.open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))
          if len(rows) != 100:
              raise SystemExit(f'{path}: expected 100 rows, got {len(rows)}')
          if list(rows[0]) != expected:
              raise SystemExit(f'{path}: invalid column order: {list(rows[0])}')
          ranks = [int(row['排名']) for row in rows]
          scores = [int(row['热度分']) for row in rows]
          repos = [row['项目'].lower() for row in rows]
          movements = [row['对比上周排名变动'] for row in rows]
          if ranks != list(range(1, 101)):
              raise SystemExit('ranking is not continuous')
          if len(set(repos)) != 100:
              raise SystemExit('duplicate repositories detected')
          if any(a <= b for a, b in zip(scores, scores[1:])):
              raise SystemExit('hotness scores are not strictly descending')
          if any(not re.fullmatch(r'(新上榜|持平|上升\d+|下降\d+)', value) for value in movements):
              raise SystemExit('invalid week-over-week movement value')
          if any(len(row['项目简介']) > 300 for row in rows):
              raise SystemExit('description longer than 300 characters')
          print(f'Validated {path}: 100 unique active AI repositories')
          PY

      - name: Commit ranking and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- scripts/generate_weekly_ranking.py
          git add -- "$OUTPUT_FILE"
          git rm -- '.github/workflows/run-weekly-20260821.yml'
          git diff --cached --check
          git commit -m 'Add weekly GitHub AI Top100 ranking: 2026年08月21日'
          git push origin HEAD:main
