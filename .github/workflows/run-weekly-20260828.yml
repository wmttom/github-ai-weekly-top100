name: One-off GitHub AI Top100 2026-08-28

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: one-off-github-ai-top100-20260828
  cancel-in-progress: false

jobs:
  generate-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'run-weekly-20260828'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      OUTPUT_FILE: 2026年08月28日.csv
      RUN_DATE: 2026-08-28

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-weekly.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-weekly.txt

      - name: Fetch and validate current official Trendshift pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import os
          import sys
          import time
          from pathlib import Path

          script = Path('scripts/generate_weekly_ranking.py')
          text = script.read_text(encoding='utf-8')
          old = 'https://trendshift.io/github-trending-repositories?trending-limit=100&trending-range=7'
          new = 'https://trendshift.io/weekly'
          if old not in text:
              raise SystemExit('Expected legacy Trendshift weekly URL was not found')
          script.write_text(text.replace(old, new, 1), encoding='utf-8')

          spec = importlib.util.spec_from_file_location('weekly_generator', script)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          spec.loader.exec_module(mod)

          urls = {
              'monthly': 'https://trendshift.io/monthly',
              'weekly': 'https://trendshift.io/weekly',
              'daily': 'https://trendshift.io/',
          }
          run_dir = Path(os.environ['RUNNER_TEMP']) / f"trendshift-{os.environ['RUN_DATE']}"
          run_dir.mkdir(parents=True, exist_ok=True)
          summary = {}

          for period, url in urls.items():
              attempts = []
              for attempt in range(1, 4):
                  started = time.time()
                  try:
                      response = mod.session().get(url, timeout=(30, 180))
                      response.raise_for_status()
                      if len(response.content) < 40000:
                          raise RuntimeError(f'response too small: {len(response.content)} bytes')
                      path = run_dir / f'{period}.html'
                      path.write_bytes(response.content)
                      rows = mod.parse(path, period)
                      attempts.append({
                          'attempt': attempt,
                          'ok': True,
                          'status': response.status_code,
                          'bytes': len(response.content),
                          'rows': len(rows),
                          'elapsed_seconds': round(time.time() - started, 2),
                      })
                      summary[period] = {'url': url, 'success': True, 'attempts': attempts, 'rows': len(rows)}
                      break
                  except Exception as exc:
                      attempts.append({
                          'attempt': attempt,
                          'ok': False,
                          'error': repr(exc),
                          'elapsed_seconds': round(time.time() - started, 2),
                      })
                      if attempt < 3:
                          time.sleep(60)
              else:
                  summary[period] = {'url': url, 'success': False, 'attempts': attempts}
                  (run_dir / 'source-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
                  raise SystemExit(f'Trendshift {period} failed after 3 attempts: {attempts[-1]}')

          (run_dir / 'source-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'TREND_DIR={run_dir}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write('## Trendshift realtime sources\n\n')
              for period in ('monthly', 'weekly', 'daily'):
                  item = summary[period]
                  handle.write(f"- {period}: success, attempts={len(item['attempts'])}, rows={item['rows']}, url={item['url']}\n")
          PY

      - name: Generate weekly ranking
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_weekly_ranking.py --repo-root . --input-dir "$TREND_DIR" --date "$RUN_DATE"

      - name: Validate generated CSV and GitHub metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUTPUT_FILE"
          python - <<'PY'
          import csv
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          expected = ['排名', '项目', '热度分', '对比上周排名变动', '项目分类', '项目 License', '项目简介']
          path = Path(os.environ['OUTPUT_FILE'])
          with path.open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))
          if len(rows) != 100:
              raise SystemExit(f'{path}: expected 100 rows, got {len(rows)}')
          if list(rows[0]) != expected:
              raise SystemExit(f'{path}: invalid column order: {list(rows[0])}')

          ranks = [int(row['排名']) for row in rows]
          scores = [int(row['热度分']) for row in rows]
          repos = [row['项目'].lower() for row in rows]
          if ranks != list(range(1, 101)):
              raise SystemExit('ranking is not continuous')
          if len(set(repos)) != 100:
              raise SystemExit('duplicate repositories detected')
          if any(a <= b for a, b in zip(scores, scores[1:])):
              raise SystemExit('hotness scores are not strictly descending')
          if any(not re.fullmatch(r'(新上榜|持平|上升\d+|下降\d+)', row['对比上周排名变动']) for row in rows):
              raise SystemExit('invalid week-over-week movement value')
          if any(not row['项目分类'].strip() for row in rows):
              raise SystemExit('empty project category')
          if any(not row['项目简介'].strip() or len(row['项目简介']) > 300 for row in rows):
              raise SystemExit('invalid project description length')

          raw_metadata = json.loads((Path(os.environ['TREND_DIR']) / 'github-metadata.json').read_text(encoding='utf-8'))
          metadata = {}
          for requested_name, item in raw_metadata.items():
              metadata[requested_name.lower()] = item
              canonical = item.get('full_name')
              if canonical:
                  metadata[canonical.lower()] = item

          now = datetime.now(timezone.utc)
          for row in rows:
              repo = row['项目']
              item = metadata.get(repo.lower())
              if not item or item.get('error_status'):
                  raise SystemExit(f'missing GitHub metadata: {repo}')
              if item.get('archived') or item.get('disabled') or item.get('fork'):
                  raise SystemExit(f'ineligible repository state: {repo}')
              pushed = item.get('pushed_at') or item.get('updated_at')
              if not pushed:
                  raise SystemExit(f'missing recent activity timestamp: {repo}')
              dt = datetime.fromisoformat(pushed.replace('Z', '+00:00'))
              if (now - dt.astimezone(timezone.utc)).days > 30:
                  raise SystemExit(f'repository inactive for more than 30 days: {repo}')

          print(f'Validated {path}: 100 unique, active AI repositories')
          print('Top 5:', ', '.join(row['项目'] for row in rows[:5]))
          print('Rank 100:', rows[-1]['项目'])
          PY

      - name: Commit and push ranking to main
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- scripts/generate_weekly_ranking.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$OUTPUT_FILE"
          git -c core.whitespace=cr-at-eol diff --cached --check
          if git diff --cached --quiet; then
            echo 'No ranking change to commit.'
            exit 0
          fi
          git commit -m 'Add weekly GitHub AI Top100 ranking: 2026年08月28日'
          git push origin HEAD:main
