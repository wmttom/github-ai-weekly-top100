name: One-off canonical Trendshift source update 2026-08-28

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: one-off-trendshift-source-update-20260828
  cancel-in-progress: false

jobs:
  persist-current-sources:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'run-weekly-20260828'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Persist canonical Trendshift pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('scripts/generate_weekly_ranking.py'),
              Path('docs/weekly-ranking-prompt.txt'),
              Path('docs/weekly-ranking-process.md'),
          ]
          replacements = {
              'https://trendshift.io/github-trending-repositories?trending-limit=100&trending-range=7': 'https://trendshift.io/weekly',
              'https://trendshift.io/github-trending-repositories?trending-range=7&trending-limit=100': 'https://trendshift.io/weekly',
              'https://trendshift.io/github-trending-repositories?trending-limit=100&trending-range=1': 'https://trendshift.io/',
              'https://trendshift.io/github-trending-repositories?trending-range=1&trending-limit=100': 'https://trendshift.io/',
              'https://trendshift.io/daily': 'https://trendshift.io/',
          }

          changed = []
          for path in paths:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if path.name == 'weekly-ranking-process.md' and 'Canonical Trendshift pages verified on 2026-08-28' not in text:
                  text += (
                      '\n\n## Canonical Trendshift pages verified on 2026-08-28\n\n'
                      '- Monthly: `https://trendshift.io/monthly`\n'
                      '- Weekly: `https://trendshift.io/weekly`\n'
                      '- Daily: `https://trendshift.io/`\n\n'
                      'The parameterized `trending-range=7` and `trending-range=1` URLs are no longer used by the scheduled ranking task. '
                      'Each canonical page must still be fetched in real time and pass the existing fail-closed retry and parse validation rules.\n'
                  )
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())

          script = Path('scripts/generate_weekly_ranking.py').read_text(encoding='utf-8')
          required = [
              '"monthly":"https://trendshift.io/monthly"',
              '"weekly":"https://trendshift.io/weekly"',
              '"daily":"https://trendshift.io/"',
          ]
          if not all(item in script for item in required):
              raise SystemExit('Generator does not contain all canonical Trendshift URLs')
          if 'trending-range=7' in script or 'trending-range=1' in script:
              raise SystemExit('Legacy parameterized Trendshift URL remains in generator')
          if not changed:
              raise SystemExit('No canonical source change was made')
          print('Updated:', ', '.join(changed))
          PY

      - name: Commit current source configuration to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- scripts/generate_weekly_ranking.py docs/weekly-ranking-prompt.txt docs/weekly-ranking-process.md
          git diff --cached --check
          git commit -m 'Use canonical Trendshift weekly and daily pages'
          git push origin HEAD:main
