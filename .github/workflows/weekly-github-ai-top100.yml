name: Weekly GitHub AI Top100

on:
  schedule:
    # Asia/Shanghai Friday 10:00 = UTC Friday 02:00.
    # Added after the 2026-07-31 slot, so the first scheduled execution is
    # Friday, 2026-08-07 at 10:00 Asia/Shanghai.
    - cron: '0 2 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-github-ai-top100
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-weekly.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-weekly.txt

      - name: Generate weekly ranking
        id: generate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_weekly_ranking.py --repo-root .

      - name: Validate generated CSV
        env:
          OUTPUT_FILE: ${{ steps.generate.outputs.output_file }}
        run: |
          set -euo pipefail
          test -n "$OUTPUT_FILE"
          test -s "$OUTPUT_FILE"
          python - <<'PY'
          import csv
          import os
          from pathlib import Path

          expected = ['排名', '项目', '热度分', '对比上周排名变动', '项目分类', '项目 License', '项目简介']
          path = Path(os.environ['OUTPUT_FILE'])
          with path.open(encoding='utf-8-sig', newline='') as handle:
              rows = list(csv.DictReader(handle))
          if len(rows) != 100:
              raise SystemExit(f'{path}: expected 100 rows, got {len(rows)}')
          if list(rows[0]) != expected:
              raise SystemExit(f'{path}: invalid column order: {list(rows[0])}')
          ranks = [int(row['排名']) for row in rows]
          scores = [int(row['热度分']) for row in rows]
          repos = [row['项目'].lower() for row in rows]
          if ranks != list(range(1, 101)):
              raise SystemExit('ranking is not continuous')
          if len(set(repos)) != 100:
              raise SystemExit('duplicate repositories detected')
          if any(a <= b for a, b in zip(scores, scores[1:])):
              raise SystemExit('hotness scores are not strictly descending')
          print(f'Validated {path}: 100 unique repositories')
          PY

      - name: Commit and push ranking
        env:
          OUTPUT_FILE: ${{ steps.generate.outputs.output_file }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$OUTPUT_FILE"
          if git diff --cached --quiet; then
            echo "No ranking change to commit."
            exit 0
          fi
          git commit -m "Add weekly GitHub AI Top100 ranking: ${OUTPUT_FILE%.csv}"
          git push origin HEAD:main
